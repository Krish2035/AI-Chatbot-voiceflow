<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Outer Pulse Circle Glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.3" filter="url(#glow)"/>
  
  <!-- Central Glowing Rounded Shield -->
  <rect x="116" y="116" width="280" height="280" rx="64" fill="url(#accentGrad)" filter="url(#glow)" opacity="0.85"/>
  <rect x="124" y="124" width="264" height="264" rx="56" fill="#0d1322"/>

  <!-- Robot Head / Bot Face -->
  <!-- Antenna -->
  <line x1="256" y1="170" x2="256" y2="198" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="162" r="10" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Robot Face Outline -->
  <rect x="176" y="200" width="160" height="120" rx="32" fill="#151e33" stroke="url(#cyanGrad)" stroke-width="6"/>

  <!-- Glowing Eyes -->
  <ellipse cx="216" cy="248" rx="16" ry="18" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="220" cy="244" r="5" fill="#ffffff"/>
  
  <ellipse cx="296" cy="248" rx="16" ry="18" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="300" cy="244" r="5" fill="#ffffff"/>

  <!-- Voice Soundwave Mouth -->
  <line x1="216" y1="288" x2="216" y2="296" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <line x1="232" y1="284" x2="232" y2="300" stroke="#06b6d4" stroke-width="5" stroke-linecap="round"/>
  <line x1="248" y1="280" x2="248" y2="304" stroke="#a855f7" stroke-width="5" stroke-linecap="round"/>
  <line x1="264" y1="280" x2="264" y2="304" stroke="#a855f7" stroke-width="5" stroke-linecap="round"/>
  <line x1="280" y1="284" x2="280" y2="300" stroke="#06b6d4" stroke-width="5" stroke-linecap="round"/>
  <line x1="296" y1="288" x2="296" y2="296" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>

  <!-- Microphone / Sound Arc bottom badge -->
  <path d="M 216 350 A 40 40 0 0 0 296 350" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="350" x2="256" y2="375" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="236" y1="375" x2="276" y2="375" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
</svg>
