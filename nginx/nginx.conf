# ========================================================
# Voiceflow AI - High Performance Load Balancer (Nginx)
# Distributes traffic across replicated backend worker instances
# ========================================================

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Upstream backend cluster (Round Robin / Least Connections)
    upstream backend_cluster {
        least_conn;
        server backend-1:5000 max_fails=3 fail_timeout=10s;
        server backend-2:5000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream frontend_cluster {
        server frontend:80;
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        # 30MB payload support for audio recordings & voiceflow transcription
        client_max_body_size 30M;

        # API & WebSocket endpoints routed to Backend Cluster
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # Swagger UI Documentation routed to Backend Cluster
        location /api-docs {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Root and frontend static assets routed to Frontend SPA
        location / {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
